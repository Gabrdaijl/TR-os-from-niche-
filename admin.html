<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TR-os Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#090e16;color:#e2eaf6;font:15px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:38px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:25px;margin:0}p{color:#99aabe;line-height:1.6}button,input{font:inherit;color:inherit;background:#142336;border:1px solid #354964;border-radius:9px;padding:11px 15px}button{cursor:pointer}button:hover{background:#213955}input{width:100%;margin:10px 0 16px}form{max-width:430px;margin:65px auto;background:#101a28;padding:28px;border:1px solid #233249;border-radius:18px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:25px 0}.card{padding:22px;background:#101a28;border:1px solid #233249;border-radius:14px}.number{font-size:31px;margin:8px 0}h2{font-size:16px;font-weight:500;color:#acbbce;margin:0}dl{background:#101a28;border-radius:14px;padding:8px 22px}dt{font-weight:650;margin-top:18px}dd{margin:5px 0 18px;color:#a9bed5;line-height:1.5}#message{color:#ffce97}a{color:#98c8ff}[hidden]{display:none!important}footer{margin-top:28px;color:#99aabe;font-size:12px}#logout{display:none}
</style></head><body><main><header><h1>TR-os <span style="color:#7b9cbe">/ Admin</span></h1><button id="logout" type="button">Logga ut</button></header><p>Driftöversikt och aktiva sessioner. Endast för webbplatsens administratör.</p><p id="message" role="status"></p>
<form id="login"><h2>Logga in</h2><label for="password">Adminlösenord</label><input id="password" type="password" autocomplete="current-password" required minlength="16"><button>Visa status</button><p>Lösenordet lagras inte i webbläsarens lagring. Inloggningen stängs efter 30 minuter.</p></form>
<section id="dashboard" hidden><div class="cards" id="cards"></div><h2>Tjänster och anslutningar</h2><dl id="services"></dl><p id="scope"></p><p id="updated"></p><button id="refresh">Uppdatera nu</button></section><footer>skapad av Gr · <a href="/">Till TR-os</a></footer></main><script src="admin.js" defer></script></body></html>
