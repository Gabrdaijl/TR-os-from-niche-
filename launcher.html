  let activeUuid = null;
  let pingInterval = null;
  let queuePollTimer = null;
  let queueFails = 0;
  let abortCtrl = null;

  function apiKey() {
    let input = document.getElementById('apiKeyInput');
    let key = input ? input.value.trim() : "";
    
    if (!key) {
      key = prompt("Enter your Cloud Gaming API Key to launch:");
      if (input && key) {
        input.value = key; 
      }
    }
    return key;
  }

  function setupOverlay() {
    let overlay = document.getElementById('nicheOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'nicheOverlay';
      overlay.className = 'fixed inset-0 bg-black hidden flex-col items-center justify-center z-50';
      overlay.innerHTML = `
        <div id="nicheLoading" class="flex flex-col items-center text-white gap-4 absolute">
          <div class="w-10 h-10 border-4 border-gray-600 border-t-white rounded-full animate-spin"></div>
          <div id="nicheLoadingText" class="text-xl font-bold">Loading…</div>
          <div id="nicheStatusSub" class="text-sm text-gray-400"></div>
        </div>
        <iframe id="nicheGameFrame" class="w-full h-full hidden bg-black" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen referrerpolicy="no-referrer"></iframe>
        <button id="nicheCloseBtn" class="absolute top-4 right-4 bg-black-600 text-white px-4 py-2 rounded-lg hover:bg-black-700 font-bold">X</button>
      `;
      document.body.appendChild(overlay);
      
      document.getElementById('nicheCloseBtn').onclick = async () => {
        if (activeUuid) {
          try {
            await apiFetch(`/cloud/v1/quitSession`, {
              method: "POST",
              headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
              body: JSON.stringify({ uuid: activeUuid }),
            });
          } catch { }
        }
        resetState();
        overlay.style.display = 'none';
        document.getElementById('nicheGameFrame').src = "";
        document.body.style.overflow = "";
      };
    }
    return overlay;
  }

  function setStatus(main, sub="") {
    const txt = document.getElementById('nicheLoadingText');
    const subTxt = document.getElementById('nicheStatusSub');
    if(txt) txt.textContent = main;
    if(subTxt) subTxt.textContent = sub;
  }

  function openOverlay(label) {
    setupOverlay();
    const overlay = document.getElementById('nicheOverlay');
    overlay.style.display = 'flex';
    document.getElementById('nicheLoading').style.display = 'flex';
    document.getElementById('nicheGameFrame').style.display = 'none';
    document.body.style.overflow = 'hidden';
    setStatus(`Loading ${label}…`);
  }

  function resetState() {
    clearInterval(pingInterval);
    clearTimeout(queuePollTimer);
    pingInterval = null; queuePollTimer = null; queueFails = 0;
    if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
    activeUuid = null;
  }

  async function launch(game) {
    resetState();
    openOverlay(game.name);
    abortCtrl = new AbortController();
    launchLog('launch', game, 'key: ' + game.key);

    if (LOCAL_GAMES[game.key]) {
      setTimeout(() => {
        document.getElementById('nicheLoading').style.display = 'none';
        document.getElementById('nicheGameFrame').style.display = 'block';
        document.getElementById('nicheGameFrame').src = LOCAL_GAMES[game.key];
        launchLog('loaded', game, 'local: ' + LOCAL_GAMES[game.key]);
      }, 1200);
      return;
    }

    setStatus(`Launching ${game.name}…`);
    let res;
    try {
      res = await apiFetch(`/cloud/v1/createSession`, {
        method: "POST",
        headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
        body: JSON.stringify({ game_key: game.key }),
        signal: abortCtrl.signal,
      });
    } catch (e) {
      setStatus("Failed to reach API.", String(e));
      launchLog('error', game, 'createSession unreachable: ' + String(e && e.message || e));
      return;
    }

    if (!res.ok || !res.body) {
      const txt = await res.text().catch(() => "");
      setStatus("createSession failed.", txt || `HTTP ${res.status}`);
      launchLog('error', game, 'createSession failed: ' + (txt || ('HTTP ' + res.status)));
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let settled = false;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line) continue;
        let msg;
        try { msg = JSON.parse(line); } catch { continue; }
        await handleStreamMsg(msg, game);
        if (msg.status === "error" || msg.status === "finished_queue") { settled = true; return; }
      }
    }
    if (!settled) setStatus("Stream ended before slot ready.", "Tap the game again to retry.");
  }

  async function handleStreamMsg(msg, game) {
    switch (msg.status) {
      case "creating_account": setStatus("Creating account…", "Just a few seconds."); break;
      case "account_ready": setStatus("Account ready.", "Requesting game session…"); break;
      case "requesting_game": setStatus("Requesting game slot…"); break;
      case "queue":
        activeUuid = msg.uuid;
        setStatus(`In queue for ${game.name}`, `Position ${msg.queue_pos ?? "?"}`);
        pollQueue(game);
        break;
      case "finished_queue":
        activeUuid = msg.uuid || activeUuid;
        setStatus("Slot ready — starting game…");
        await startGame(game);
        break;
      case "error":
        setStatus("Error.", msg.error || "Unknown error.");
        launchLog('error', game, 'stream: ' + (msg.error || 'Unknown error.'));
        break;
    }
  }

  function queueDead(game, why) {    resetState();
    setStatus("Queue lost.", (why || "Session expired.") + " Tap the game again to retry.");
  }
  async function pollQueue(game) {
    if (!activeUuid) return;
    try {
      const res = await apiFetch(`/cloud/v1/getQueue?uuid=${activeUuid}`, { headers: { "x-api-key": apiKey() }, cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      queueFails = 0;
      if (data.status === "queue") {
        setStatus(`In queue for ${game.name}`, `Position ${data.queue_pos ?? "?"}`);
        queuePollTimer = setTimeout(() => pollQueue(game), 4000);
      } else if (data.status === "finished_queue") {
        setStatus("Slot ready — starting game…");
        await startGame(game);
      } else {
        queueDead(game, "Session is gone.");
      }
    } catch (e) {
      queueFails++;
      if (queueFails >= 8) { queueDead(game, "Could not reach queue."); return; }
      setStatus("Queue poll failed, retrying…", String(e));
      queuePollTimer = setTimeout(() => pollQueue(game), 4000);
    }
  }

  async function startGame(game) {
    if (!activeUuid) return;
    let res, data;
    try {
      res = await apiFetch(`/cloud/v1/startGame`, {
        method: "POST",
        headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
        body: JSON.stringify({ uuid: activeUuid }),
      });
      data = await res.json();
    } catch (e) {
      setStatus("startGame failed.", String(e));
      launchLog('error', game, 'startGame failed: ' + String(e && e.message || e));
      return;
    }

    if (!res.ok) {
      setStatus("startGame rejected.", data.error || `HTTP ${res.status}`);
      launchLog('error', game, 'startGame rejected: ' + (data.error || ('HTTP ' + res.status)));
      return;
    }

    setStatus("Connecting…");
    const frame = document.getElementById('nicheGameFrame');
    frame.src = `${apiBase || ""}/cloud/v1/embed?id=${encodeURIComponent(activeUuid)}&host=${encodeURIComponent(location.host)}`;
    frame.onload = () => {
      document.getElementById('nicheLoading').style.display = 'none';
      frame.style.display = 'block';
      setStatus("Live", "Streaming — click inside to capture keyboard/mouse.");
      launchLog('loaded', game, 'uuid: ' + activeUuid);
    };

    pingInterval = setInterval(async () => {
      try {
        await apiFetch(`/cloud/v1/pingSession`, {
          method: "POST",
          headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
          body: JSON.stringify({ uuid: activeUuid }),
        });
      } catch { }
    }, 15000);
  }

  document.addEventListener("DOMContentLoaded", () => {
    setupOverlay();
    
    const nav = document.querySelector('.mt-2.h-15') || document.querySelector('.flex.items-center.justify-center.gap-2');
    if (nav && !document.getElementById('apiKeyInput')) {
      const input = document.createElement('input');
      input.id = 'apiKeyInput';
      input.type = 'text';
      input.placeholder = 'API Key';
      input.className = 'bg-blue-500 text-white px-2 py-1 rounded-lg border border-blue-200 w-40 text-xs outline-none';
      nav.appendChild(input);
    }

    const container = document.getElementById('gameGrid') || document.querySelector('.h-\\[765px\\]') || document.querySelector('.mx-auto.w-\\[99\\%\\]');
    window.renderGames = function(filter) {
      if (!container) return;
      container.style.flexWrap = "wrap";
      container.style.overflowY = "auto";
      container.style.alignContent = "flex-start";
      container.innerHTML = '';

      const q = (filter || '').trim().toLowerCase();
      let shown = 0;
      GAMES.forEach(game => {
        if (q) {
          const hay = (game.name + ' ' + (game.tags || []).join(' ') + ' ' + (game.tagline || '')).toLowerCase();
          if (!hay.includes(q)) return;
        }
        const card = document.createElement('div');
        card.className = 'bg-blue-400 p-2 rounded-xl w-50 h-62 flex flex-col items-center justify-start cursor-pointer hover:bg-blue-500 transition-all m-1 relative';
        card.innerHTML = `
          <img src="${game.img}" class="w-full h-34 object-cover rounded-md" alt="${game.name}">
          <h3 class="text-white text-xs font-bold text-center mt-2">${game.name}</h3>
          <p class="text-blue-100 text-[14px] text-center mt-1">${game.tagline || ''}</p>
        `;
        card.addEventListener('click', () => launch(game));
        container.appendChild(card);
        shown++;
      });
      if (!shown) container.innerHTML = '<div class="text-white p-4">No games match.</div>';
    };
    renderGames('');
    const gsi = document.getElementById('gameSearch');
    if (gsi) gsi.addEventListener('input', () => renderGames(gsi.value));
  });
</script>
  <script src="online.js"></script>
</body>
