          <script>
  async function apiFetch(path, opts = {}) {
    const response = await window.TR_OS.fetch(path, { ...opts, signal: opts.signal || AbortSignal.timeout(15000) });
    return response;
  }
  function launchLog(event, game, detail) {
    try {
      window.TR_OS.fetch('/chat/log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          kind: 'cloud',
          title: 'Cloud launcher: ' + event,
          fields: [
            { name: 'Game', value: ltruncate(game && game.name, 100) || '-', inline: true },
            { name: 'Launched from', value: ltruncate((function () { try { return window.location.href; } catch (e) { return ''; } })(), 200) || '-' },
            { name: 'Detail', value: ltruncate(detail, 1000) || '-' }
          ]
        })
      }).catch(() => {});
    } catch {}
  }

  function ltruncate(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '… (truncated)' : s; }

  const LOCAL_GAMES = {
    minecraft: "novix.html",
    vicecity: "gtavc.html",
  };

  const GAMES = window.TR_OS_LAUNCHER_GAMES || [];

  let activeUuid = null;
  let pingInterval = null;
  let queuePollTimer = null;
  let queueFails = 0;
  let abortCtrl = null;
  let cloudAvailable = null;

  function apiKey() {
    if (window.TR_OS.cloudKeyOnServer) return "";
    let input = document.getElementById('apiKeyInput');
    let key = input ? input.value.trim() : "";


    return key;
  }

  function setupOverlay() {
    let overlay = document.getElementById('trosOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'trosOverlay';
      overlay.className = 'fixed inset-0 bg-black hidden flex-col items-center justify-center z-50';
      overlay.innerHTML = `
        <div id="trosLoading" class="flex flex-col items-center text-white gap-4 absolute">
          <div id="trosSpinner" class="w-10 h-10 border-4 border-gray-600 border-t-white rounded-full animate-spin"></div>
          <div id="trosLoadingText" class="text-xl font-bold">Loading…</div>
          <div id="trosStatusSub" class="text-sm text-gray-400"></div>
        </div>
        <iframe id="trosGameFrame" class="w-full h-full hidden bg-black" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen referrerpolicy="no-referrer"></iframe>
        <button id="trosCloseBtn" class="absolute top-4 right-4 bg-black-600 text-white px-4 py-2 rounded-lg hover:bg-black-700 font-bold">X</button>
        <button id="trosExternalCloudBtn" hidden style="position:absolute;left:16px;top:16px;z-index:60;background:#132a38;color:#cfeaff;border:1px solid #24475b;border-radius:8px;padding:8px 14px;cursor:pointer">Öppna extern cloud</button>
      `;
      document.body.appendChild(overlay);
      document.getElementById('trosExternalCloudBtn').onclick = () => {
        resetState();
        const frame = document.getElementById('trosGameFrame');
        setStatus('Öppnar extern cloudtjänst…', 'Välj spelet i tjänstens katalog. Tillgång, köer och eventuella kontokrav bestäms av tjänsten.');
        document.getElementById('trosExternalCloudBtn').hidden = true;
        frame.onload = () => {
          document.getElementById('trosLoading').style.display = 'none';
          frame.style.display = 'block';
        };
        frame.src = 'https://t9os.space/launcher.html';
      };

      document.getElementById('trosCloseBtn').onclick = () => {
        const closingUuid = activeUuid;
        resetState();
        overlay.style.display = 'none';
        const frame = document.getElementById('trosGameFrame');
        frame.onload = null;
        frame.src = 'about:blank';
        document.body.style.overflow = '';
        if (closingUuid) apiFetch('/cloud/v1/quitSession', {
          method: 'POST',
          headers: { 'x-api-key': apiKey(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ uuid: closingUuid })
        }).catch(() => {});
      };
    }
    return overlay;
  }

  function setStatus(main, sub="", busy=true) {
    const txt = document.getElementById('trosLoadingText');
    const subTxt = document.getElementById('trosStatusSub');
    if(txt) txt.textContent = main;
    if(subTxt) subTxt.textContent = sub;
    const spinner = document.getElementById('trosSpinner');
    if (spinner) spinner.hidden = !busy;
  }

  function openOverlay(label) {
    setupOverlay();
    const overlay = document.getElementById('trosOverlay');
    overlay.style.display = 'flex';
    document.getElementById('trosLoading').style.display = 'flex';
    document.getElementById('trosGameFrame').style.display = 'none';
    document.getElementById('trosExternalCloudBtn').hidden = true;
    document.body.style.overflow = 'hidden';
    setStatus(`Loading ${label}…`);
  }

  function resetState() {
    clearInterval(pingInterval);
    clearTimeout(queuePollTimer);
    pingInterval = null; queuePollTimer = null; queueFails = 0;
    if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
    activeUuid = null;
  }

  async function launch(game) {
    resetState();
    openOverlay(game.name);
    abortCtrl = new AbortController();
    launchLog('launch', game, 'key: ' + game.key);

    if (game.provider === 'mobile') {
      setStatus('Ingen egen mobilspelserver är ansluten.', 'Öppna extern cloud ovan och välj spelet i tjänstens katalog. Tjänsten hanterar sina egna köer och kontokrav.', false);
      document.getElementById('trosExternalCloudBtn').hidden = false;
      return;
    }
    if (LOCAL_GAMES[game.key]) {
      setTimeout(() => {
        document.getElementById('trosLoading').style.display = 'none';
        document.getElementById('trosGameFrame').style.display = 'block';
        document.getElementById('trosGameFrame').src = LOCAL_GAMES[game.key];
        launchLog('loaded', game, 'local: ' + LOCAL_GAMES[game.key]);
      }, 0);
      return;
    }

    if (window.TR_OS.cloudConfigured === false) {
      setStatus("Ingen egen spelserver är ansluten till TR-os.", "Öppna extern cloud ovan och välj spelet i tjänstens katalog.", false);
      document.getElementById('trosExternalCloudBtn').hidden = false;
      return;
    }
    if (cloudAvailable === false) {
      setStatus("Cloud service is offline.", "Close this panel and try again later. Your game catalog is still available.", false);
      document.getElementById('trosExternalCloudBtn').hidden = false;
      return;
    }
    if (!window.TR_OS.cloudKeyOnServer && !apiKey()) {
      setStatus("Cloud access key required.", "Close this panel and enter your cloud access key, then try again.", false);
      document.getElementById('trosExternalCloudBtn').hidden = false;
      return;
    }
    setStatus(`Connecting to cloud service…`, game.name);
    let res;
    try {
      res = await apiFetch(`/cloud/v1/createSession`, {
        method: "POST",
        headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
        body: JSON.stringify({ game_key: game.key }),
        signal: abortCtrl.signal,
      });
    } catch (e) {
      setStatus("Failed to reach API.", String(e));
      launchLog('error', game, 'createSession unreachable: ' + String(e && e.message || e));
      return;
    }

    if (!res.ok || !res.body) {
      const txt = await res.text().catch(() => "");
      let detail; try { detail = JSON.parse(txt).error; } catch {}
      setStatus(res.status === 401 || res.status === 403 ? "Cloud access key rejected." : "Cloud service unavailable.", detail || `HTTP ${res.status}. Close and retry later.`);
      launchLog('error', game, 'createSession failed: ' + (txt || ('HTTP ' + res.status)));
      return;
    }

    try {
      const status = await TR_OS_CLOUD.readSessionStream(res, msg => handleStreamMsg(msg, game), abortCtrl.signal);
      if (!status) setStatus("Cloud server ended the connection.", "Close and try the game again.");
    } catch (error) {
      if (error.name !== 'AbortError') setStatus("Cloud connection interrupted.", "Close and try again.");
    }
  }

  async function handleStreamMsg(msg, game) {
    switch (msg.status) {
      case "creating_account": setStatus("Creating account…", "Just a few seconds."); break;
      case "account_ready": setStatus("Account ready.", "Requesting game session…"); break;
      case "requesting_game": setStatus("Requesting game slot…"); break;
      case "queue":
        activeUuid = msg.uuid;
        setStatus(`In queue for ${game.name}`, `Position ${msg.queue_pos ?? "?"}`);
        pollQueue(game);
        break;
      case "finished_queue":
        activeUuid = msg.uuid || activeUuid;
        setStatus("Slot ready — starting game…");
        await startGame(game);
        break;
      case "error":
        setStatus("Error.", msg.error || "Unknown error.");
        launchLog('error', game, 'stream: ' + (msg.error || 'Unknown error.'));
        break;
    }
  }

  function queueDead(game, why) {    resetState();
    setStatus("Queue lost.", (why || "Session expired.") + " Tap the game again to retry.");
  }
  async function pollQueue(game) {
    if (!activeUuid) return;
    try {
      const res = await apiFetch(`/cloud/v1/getQueue?uuid=${activeUuid}`, { headers: { "x-api-key": apiKey() }, cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      queueFails = 0;
      if (data.status === "queue") {
        setStatus(`In queue for ${game.name}`, `Position ${data.queue_pos ?? "?"}`);
        queuePollTimer = setTimeout(() => pollQueue(game), (typeof data.queue_pos === "number" && data.queue_pos > 10) ? 20000 : 8000);
      } else if (data.status === "finished_queue") {
        setStatus("Slot ready — starting game…");
        await startGame(game);
      } else {
        queueDead(game, "Session is gone.");
      }
    } catch (e) {
      queueFails++;
      if (queueFails >= 8) { queueDead(game, "Could not reach queue."); return; }
      setStatus("Queue poll failed, retrying…", String(e));
      queuePollTimer = setTimeout(() => pollQueue(game), 12000);
    }
  }

  async function startGame(game) {
    if (!activeUuid) return;
    let res, data;
    try {
      res = await apiFetch(`/cloud/v1/startGame`, {
        method: "POST",
        headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
        body: JSON.stringify({ uuid: activeUuid }),
      });
      data = await res.json();
    } catch (e) {
      setStatus("startGame failed.", String(e));
      launchLog('error', game, 'startGame failed: ' + String(e && e.message || e));
      return;
    }

    if (!res.ok) {
      setStatus("startGame rejected.", data.error || `HTTP ${res.status}`);
      launchLog('error', game, 'startGame rejected: ' + (data.error || ('HTTP ' + res.status)));
      return;
    }

    setStatus("Connecting…");
    const frame = document.getElementById('trosGameFrame');
    const playerUrl = TR_OS.apiUrl(`/cloud/v1/embed?id=${encodeURIComponent(activeUuid)}&host=${encodeURIComponent(location.host)}`);
    frame.onload = () => {
      if (!activeUuid) return;
      document.getElementById('trosLoading').style.display = 'none';
      frame.style.display = 'block';
      setStatus("Player loaded", "Click inside to capture keyboard/mouse.");
      launchLog('loaded', game, 'uuid: ' + activeUuid);
    };

    frame.src = playerUrl;

    pingInterval = setInterval(async () => {
      try {
        await apiFetch(`/cloud/v1/pingSession`, {
          method: "POST",
          headers: { "x-api-key": apiKey(), "Content-Type": "application/json" },
          body: JSON.stringify({ uuid: activeUuid }),
        });
      } catch { }
    }, 15000);
  }

  document.addEventListener("DOMContentLoaded", () => {
    setupOverlay();

    const nav = document.querySelector('.mt-2.h-15') || document.querySelector('.flex.items-center.justify-center.gap-2');
    if (nav && !document.getElementById('apiKeyInput')) {
      const input = document.createElement('input');
      input.id = 'apiKeyInput';
      input.type = 'password';
      input.placeholder = 'API Key';
      input.className = 'bg-blue-500 text-white px-2 py-1 rounded-lg border border-blue-200 w-40 text-xs outline-none';
      nav.appendChild(input);
    }

    const container = document.getElementById('gameGrid') || document.querySelector('.h-\\[765px\\]') || document.querySelector('.mx-auto.w-\\[99\\%\\]');
    window.renderGames = function(filter) {
      if (!container) return;
      container.style.flexWrap = "wrap";
      container.style.overflowY = "auto";
      container.style.alignContent = "flex-start";
      container.innerHTML = '';

      const q = (filter || '').trim().toLowerCase();
      let shown = 0;
      GAMES.forEach(game => {
        if (q) {
          const hay = (game.name + ' ' + (game.tags || []).join(' ') + ' ' + (game.tagline || '')).toLowerCase();
          if (!hay.includes(q)) return;
        }
        const card = document.createElement('div');
        card.className = 'bg-blue-400 p-2 rounded-xl w-50 h-62 flex flex-col items-center justify-start cursor-pointer hover:bg-blue-500 transition-all m-1 relative';
        card.tabIndex = 0;
        card.setAttribute("role", "button");
        card.setAttribute("aria-label", "Launch " + game.name);
        const image = document.createElement('img');
        image.src = game.img;
        image.alt = game.name;
        image.className = 'w-full h-34 object-cover rounded-md';
        const title = document.createElement('h3');
        title.className = 'text-white text-xs font-bold text-center mt-2';
        title.textContent = game.name;
        const tag = document.createElement('p');
        tag.className = 'text-blue-100 text-[14px] text-center mt-1';
        tag.textContent = game.tagline || '';
        card.append(image, title, tag);
        card.addEventListener('click', () => launch(game));
        card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); launch(game); } });
        image.loading = 'lazy';
        image.addEventListener('error', () => { if (!image.src.endsWith('/logo.png')) image.src = 'logo.png'; });
        container.appendChild(card);
        shown++;
      });
      if (!shown) container.innerHTML = '<div class="text-white p-4">No games match.</div>';
      document.getElementById('catalogCount').textContent = q ? shown + ' of ' + GAMES.length + ' titles' : GAMES.length + ' titles · ' + GAMES.filter(game => game.provider === 'cloud').length + ' PC · ' + GAMES.filter(game => game.provider === 'mobile').length + ' mobile';
    };
    renderGames('');
    document.getElementById('gameSearch').placeholder = 'Search ' + GAMES.length + ' cloud titles…';
    const serviceStatus = document.getElementById('cloudServiceStatus');
    const keyInput = document.getElementById('apiKeyInput');
    keyInput.hidden = window.TR_OS.cloudKeyOnServer;
    TR_OS.fetch('/api/cloud/status', { signal: AbortSignal.timeout(7000) }).then(response => response.json()).then(status => {
      cloudAvailable = status.configured && status.available;
      serviceStatus.textContent = !status.configured ? 'Cloud service is not connected. The catalog is available below.' : !status.available ? 'Cloud service is offline. Games cannot start right now.' : status.keyRequired ? 'Cloud service reachable. Enter your access key to start a game.' : 'Cloud service reachable. Choose a game to start.';
    }).catch(() => { serviceStatus.textContent = 'Cloud service could not be checked. Try again later.'; });
    const gsi = document.getElementById('gameSearch');
    if (gsi) gsi.addEventListener('input', () => renderGames(gsi.value));
  });
</script>
