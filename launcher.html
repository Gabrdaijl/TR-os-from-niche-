<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TR-os Cloud</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080d14;color:#eaf4ff;font:14px system-ui,-apple-system,sans-serif}
    body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
    header{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0d151f;border-bottom:1px solid #223145}
    .brand{font-weight:650;letter-spacing:-.02em}.service{color:#8097ad;font-size:12px}
    button{margin-left:auto;border:1px solid #344f68;border-radius:9px;background:#172a3c;color:#eaf4ff;min-height:34px;padding:6px 13px;font:600 13px system-ui;cursor:pointer}
    button:hover{background:#223c54}button:focus-visible{outline:3px solid #8acbff;outline-offset:3px}
    #fullscreen-status{color:#c8d8e8;font-size:12px}
    iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:#000}
    @media(max-width:500px){header{padding:0 10px;gap:8px}.service{display:none}}
  </style>
</head>
<body>
  <header><span class="brand">TR-os Cloud</span><span class="service">Extern tjänst</span><span id="fullscreen-status" role="status"></span><button id="fullscreen" type="button" aria-pressed="false">⛶ Fullskärm</button></header>
  <iframe id="cloud-frame" src="https://t9os.space/launcher.html" title="Cloudspelare" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen referrerpolicy="no-referrer"></iframe>
  <script>
    const fullscreen = document.getElementById('fullscreen');
    const status = document.getElementById('fullscreen-status');
    fullscreen.addEventListener('click', async () => {
      status.textContent = '';
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        status.textContent = 'Fullskärm kunde inte öppnas. Prova F11 på datorn.';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const active = !!document.fullscreenElement;
      fullscreen.textContent = active ? '⛶ Avsluta fullskärm' : '⛶ Fullskärm';
      fullscreen.setAttribute('aria-pressed', String(active));
    });
  </script>
</body>
</html>
