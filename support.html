<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b111a">
  <meta name="robots" content="noindex,nofollow">
  <title>Supportchatt · TR-os</title>
  <link rel="stylesheet" href="/support.css?v=20261020.1">
  <script src="/theme.js" defer></script>
</head>
<body>
  <main class="support-shell support-page">
    <header class="support-topbar">
      <a class="support-brand" href="/" aria-label="Till TR-os"><span class="brand-mark">T</span><span>TR-os<small>Hjälpcenter</small></span></a>
      <a class="home-button" href="/">Tillbaka till TR-os <span aria-hidden="true">↗</span></a>
    </header>
    <section class="support-chat-card support-page-card" aria-labelledby="moderation-chat-title">
      <div class="chat-heading"><div><p class="support-eyebrow">PRIVAT SUPPORTÄRENDE</p><h1 id="moderation-chat-title">Supportchat</h1><p class="chat-intro">Skriv direkt till administratören. Samtalet finns kvar även efter att spärren hävts.</p></div><span class="chat-status"><i></i> Öppet</span></div>
      <div id="moderation-chat-messages" class="support-messages" role="log" aria-live="polite" aria-label="Meddelanden i supportchatten"></div>
      <form id="moderation-chat-form" class="support-form">
        <label class="sr-only" for="moderation-chat-input">Ditt meddelande</label>
        <textarea id="moderation-chat-input" maxlength="2000" required rows="3" placeholder="Skriv ditt meddelande…"></textarea>
        <div class="support-form-bottom"><span id="moderation-chat-state" role="status" aria-live="polite"></span><button type="submit"><span>Skicka</span><span aria-hidden="true">↗</span></button></div>
      </form>
      <div class="push-row"><div><strong>Få svar direkt</strong><p>Få en notis när administratören svarar.</p></div><button id="moderation-push" class="push-opt-in" type="button">Aktivera notiser</button></div>
      <span id="moderation-push-state" class="push-state" role="status" aria-live="polite"></span>
    </section>
    <footer class="support-footer">Dina meddelanden kopplas till den här webbläsaren.</footer>
  </main>
  <script src="/moderation-client.js?v=20261020.1" defer></script>
</body>
</html>
